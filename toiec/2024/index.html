<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Practice Platform</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header-nav">
        <div class="nav-left">
            <select id="testSelector" onchange="loadTest(this.value)">
                <option value="">-- Chọn bài Test --</option>
                <option value="test01">Test 01</option>
                <option value="test02">Test 02</option>
            </select>
            <span id="loadingStatus" class="status-text">Đang tải...</span>
        </div>
        <div id="progressInfo" class="nav-right" style="display: none;">
            Hoàn thành: <span id="completedCount">0</span>/71
        </div>
    </header>

    <main class="container" id="quizScreen" style="display: none;">
        <div class="main-quiz">
            <div class="audio-container">
                <audio id="quizAudio" controls></audio>
            </div>

            <div id="imageContainer" class="image-box" style="display: none;">
                <img id="quizImage" src="" alt="Question Graphic">
            </div>

            <div class="quiz-content">
                <div class="quiz-header">
                    <button class="toggle-btn" onclick="toggleDoanVan()">Show Transcript ▼</button>
                    <div id="doanVanText" class="transcript-content"></div>
                </div>

                <div class="question-section">
                    <p id="questionText" class="en-text"></p>
                    <p id="questionDich" class="vi-text" style="display: none; color: #64748b; font-style: italic;"></p>
                </div>
                
                <ul id="options" class="options-list"></ul>

                <div id="explanation" class="explanation-box" style="display: none;">
                    <strong class="exp-label">Giải thích:</strong>
                    <p id="explanationText"></p>
                </div>
            </div>

            <footer class="nav-buttons">
                <button class="nav-btn secondary" onclick="prevQuiz()">❮ Previous</button>
                <button class="nav-btn primary" onclick="nextQuiz()">Next ❯</button>
            </footer>
        </div>

        <button id="floatingMenuBtn" onclick="toggleMenu()">☰</button>
        
        <div id="menuOverlay" class="menu-overlay" onclick="if(event.target == this) toggleMenu()">
            <div class="menu-content">
                <div class="menu-header">
                    <h3>Question Map</h3>
                    <button class="close-btn" onclick="toggleMenu()">✕</button>
                </div>
                <div class="question-grid" id="questionGrid"></div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
