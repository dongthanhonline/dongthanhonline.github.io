<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Thi TOEIC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #333;
            display: flex; /* Use flexbox for main layout */
            min-height: 100vh; /* Ensure body takes full viewport height */
        }
        .sidebar-nav {
            width: 200px;
            background-color: #ffffff;
            padding: 1.5rem;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.05);
            position: sticky; /* Make sidebar sticky */
            top: 0; /* Stick to the top */
            height: 100vh; /* Full height */
            overflow-y: auto; /* Scrollable if many questions */
            border-right: 1px solid #e5e7eb;
            display: flex;
            flex-direction: column;
            border-radius: 0 12px 12px 0; /* Rounded right corners */
        }
        .sidebar-nav h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .sidebar-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columns for question numbers */
            gap: 0.5rem;
        }
        .sidebar-item {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0.5rem;
            background-color: #f9fafb;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #4b5563;
            transition: all 0.2s ease-in-out;
        }
        .sidebar-item:hover {
            background-color: #e0e7ff;
            border-color: #6366f1;
            color: #4f46e5;
        }
        .sidebar-item.answered {
            background-color: #d1fae5; /* Default answered: light green */
            border-color: #10b981;
            color: #065f46;
        }
        .sidebar-item.selected-current {
            background-color: #bfdbfe; /* Highlight current question */
            border-color: #3b82f6;
            color: #1e40af;
            font-weight: 700;
        }
        /* New styles for correct/incorrect answers in sidebar */
        .sidebar-item.correct-answer {
            background-color: #d1fae5; /* Green for correct */
            border-color: #10b981;
            color: #065f46;
        }
        .sidebar-item.incorrect-answer {
            background-color: #fee2e2; /* Red for incorrect */
            border-color: #ef4444;
            color: #991b1b;
        }
        /* Ensure selected-current still applies visual distinction */
        .sidebar-item.correct-answer.selected-current {
            background-color: #a7f3d0; /* Lighter green when selected */
            border-color: #059669;
        }
        .sidebar-item.incorrect-answer.selected-current {
            background-color: #fecaca; /* Lighter red when selected */
            border-color: #dc2626;
        }


        .main-content {
            flex-grow: 1; /* Take remaining width */
            padding: 1.5rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto; /* Center the content within main-content */
            padding: 1.5rem;
            background-color: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .question-card {
            background-color: #fdfdfd;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.2s ease-in-out;
        }
        .question-card.answered {
            border-color: #d1d5db;
        }
        .question-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 1rem;
            line-height: 1.6;
            color: #1f2937;
        }
        .answer-option {
            display: flex;
            align-items: center;
            padding: 0.8rem 1rem;
            margin-bottom: 0.75rem;
            background-color: #f9fafb;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .answer-option:hover:not(.selected):not(.correct):not(.incorrect) {
            background-color: #edf2f7;
            border-color: #c5d0db;
        }
        .answer-option input[type="radio"] {
            margin-right: 0.8rem;
            transform: scale(1.2);
            accent-color: #4f46e5;
        }
        .answer-option.selected {
            background-color: #e0e7ff;
            border-color: #6366f1;
        }
        .answer-option.correct {
            background-color: #d1fae5;
            border-color: #10b981;
            font-weight: 600;
            color: #065f46;
        }
        .answer-option.incorrect {
            background-color: #fee2e2;
            border-color: #ef4444;
            font-weight: 600;
            color: #991b1b;
        }
        .correct-indicator, .incorrect-indicator {
            margin-left: auto;
            font-weight: 700;
            font-size: 1.2rem;
        }
        .correct-indicator {
            color: #10b981;
        }
        .incorrect-indicator {
            color: #ef4444;
        }
        .explanation {
            background-color: #f0f9ff;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 0 8px 8px 0;
            color: #1d4ed8;
            font-size: 0.95rem;
        }
        .submit-button {
            background-color: #4f46e5;
            color: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
            margin-top: 2rem;
            box-shadow: 0 4px 8px rgba(79, 70, 229, 0.3);
        }
        .submit-button:hover {
            background-color: #4338ca;
        }
        .score-card {
            background-color: #ecfdf5;
            border: 2px solid #10b981;
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            margin-top: 2rem;
            box-shadow: 0 6px 12px rgba(16, 185, 129, 0.2);
        }
        .score-card h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #065f46;
            margin-bottom: 1rem;
        }
        .score-card p {
            font-size: 1.4rem;
            color: #047857;
        }
        .review-button {
            background-color: #10b981;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 1.5rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .review-button:hover {
            background-color: #059669;
        }
        .restart-button {
            background-color: #f59e0b;
            color: white;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-left: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .restart-button:hover {
            background-color: #d97706;
        }
        .footer-text {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280;
            font-size: 0.9rem;
        }
        .dich-toggle {
            font-style: italic;
            color: #6b7280;
            margin-top: 0.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: underline;
            display: inline-block; /* Allows text-decoration */
        }
        .dich-text {
            color: #6b7280;
            margin-top: 0.2rem;
            font-size: 0.95rem;
            display: none; /* Hidden by default */
        }
        /* Media queries for responsiveness */
        @media (max-width: 768px) {
            body {
                flex-direction: column; /* Stack sidebar and main content on small screens */
            }
            .sidebar-nav {
                width: 100%;
                height: auto;
                position: relative;
                border-radius: 12px 12px 0 0;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
                border-bottom: 1px solid #e5e7eb;
                border-right: none;
            }
            .sidebar-nav h2 {
                margin-bottom: 1rem;
            }
            .sidebar-grid {
                grid-template-columns: repeat(5, 1fr); /* More columns for compact view on mobile */
            }
            .main-content {
                padding: 1rem;
            }
            .container {
                margin: 0 auto;
                padding: 1rem;
            }
            .question-text {
                font-size: 1rem;
            }
            .answer-option {
                padding: 0.6rem 0.8rem;
                font-size: 0.9rem;
            }
            .submit-button, .review-button, .restart-button {
                font-size: 1rem;
                padding: 0.8rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar-nav">
        <h2>Danh sách câu hỏi</h2>
        <div id="sidebar-grid" class="sidebar-grid">
            <!-- Sidebar items will be loaded here -->
        </div>
    </div>
    <div class="main-content">
        <div class="container">
            <h1 class="text-3xl font-bold text-center mb-8 text-indigo-700">Luyện Thi TOEIC Cùng Gemini</h1>
            <div id="quiz-container">
                <!-- Questions will be loaded here by JavaScript -->
            </div>
            <button id="submit-quiz" class="submit-button">Nộp bài và xem kết quả</button>
            <div id="score-container" class="score-card hidden">
                <h2>Kết Quả Của Bạn</h2>
                <p><span id="correct-count" class="font-bold text-green-700">0</span> / <span id="total-questions" class="font-bold">0</span> câu đúng</p>
                <button id="review-answers" class="review-button">Xem lại đáp án</button>
                <button id="restart-quiz" class="restart-button">Làm lại bài</button>
            </div>
            <p class="footer-text">Chúc bạn học tốt!</p>
        </div>
    </div>

                translation: "Đạt được những đánh giá tốt từ cấp trên trực tiếp nên là mục tiêu chính của những người muốn được thăng chức trong năm nay.",

        let userAnswers = {}; // Lưu trữ đáp án của người dùng
        let currentQuestionId = null; // Theo dõi câu hỏi hiện tại đang xem

        const quizContainer = document.getElementById('quiz-container');
        const submitButton = document.getElementById('submit-quiz');
        const scoreContainer = document.getElementById('score-container');
        const correctCountSpan = document.getElementById('correct-count');
        const totalQuestionsSpan = document.getElementById('total-questions');
        const reviewAnswersButton = document.getElementById('review-answers');
        const restartQuizButton = document.getElementById('restart-quiz');
        const sidebarGrid = document.getElementById('sidebar-grid');

        // Hàm để tạo và hiển thị thanh điều hướng bên trái
        function renderSidebar() {
            sidebarGrid.innerHTML = ''; // Xóa các mục cũ
            questions.forEach(q => {
                const sidebarItem = document.createElement('div');
                sidebarItem.classList.add('sidebar-item');
                sidebarItem.id = `sidebar-item-${q.id}`;
                sidebarItem.textContent = q.id;
                sidebarItem.addEventListener('click', () => scrollToQuestion(q.id));
                sidebarGrid.appendChild(sidebarItem);
            });
            updateSidebarHighlight();
        }

        // Hàm để cuộn đến một câu hỏi cụ thể và làm nổi bật trên sidebar
        function scrollToQuestion(id) {
            const questionElement = document.getElementById(`question-${id}`);
            if (questionElement) {
                questionElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                currentQuestionId = id;
                updateSidebarHighlight();
            }
        }

        // Hàm cập nhật trạng thái nổi bật của câu hỏi trên sidebar
        function updateSidebarHighlight() {
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('selected-current');
            });
            if (currentQuestionId) {
                const currentSidebarItem = document.getElementById(`sidebar-item-${currentQuestionId}`);
                if (currentSidebarItem) {
                    currentSidebarItem.classList.add('selected-current');
                }
            }
        }

        // Hàm quan sát các phần tử câu hỏi để cập nhật sidebar khi cuộn
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const questionId = parseInt(entry.target.id.replace('question-', ''));
                    if (currentQuestionId !== questionId) {
                        currentQuestionId = questionId;
                        updateSidebarHighlight();
                    }
                }
            });
        }, { threshold: 0.5 }); // Khi 50% câu hỏi hiển thị

        function loadQuiz() {
            quizContainer.innerHTML = ''; // Xóa các câu hỏi cũ nếu có
            userAnswers = {}; // Reset đáp án của người dùng
            scoreContainer.classList.add('hidden'); // Ẩn phần kết quả

            questions.forEach(q => {
                const questionCard = document.createElement('div');
                questionCard.classList.add('question-card');
                questionCard.id = `question-${q.id}`;

                questionCard.innerHTML = `
                    <div class="question-text">Câu ${q.id}. ${q.question}</div>
                    <div class="dich-toggle" data-question-id="${q.id}">[Hiển thị dịch nghĩa]</div>
                    <div id="dich-text-${q.id}" class="dich-text">Dịch: ${q.translation}</div>
                    <div class="options mt-4">
                        ${q.options.map((option, index) => `
                            <label class="answer-option">
                                <input type="radio" name="question-${q.id}" value="${index}">
                                <span>${option.text}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div id="explanation-${q.id}" class="explanation hidden"></div>
                `;
                quizContainer.appendChild(questionCard);

                // Thêm sự kiện lắng nghe cho các radio button để lưu đáp án và cập nhật sidebar
                questionCard.querySelectorAll(`input[name="question-${q.id}"]`).forEach(radio => {
                    radio.addEventListener('change', (event) => {
                        userAnswers[q.id] = parseInt(event.target.value);
                        // Cập nhật trạng thái 'selected' cho option
                        questionCard.querySelectorAll('.answer-option').forEach(opt => opt.classList.remove('selected'));
                        event.target.closest('.answer-option').classList.add('selected');

                        // Cập nhật trạng thái của câu hỏi trên sidebar (chỉ đánh dấu đã trả lời)
                        const sidebarItem = document.getElementById(`sidebar-item-${q.id}`);
                        if (sidebarItem) {
                            sidebarItem.classList.add('answered');
                            sidebarItem.classList.remove('correct-answer', 'incorrect-answer'); // Xóa trạng thái đúng/sai nếu có
                        }
                    });
                });

                // Thêm sự kiện lắng nghe cho nút hiển thị dịch nghĩa
                questionCard.querySelector(`.dich-toggle[data-question-id="${q.id}"]`).addEventListener('click', (event) => {
                    const translationText = document.getElementById(`dich-text-${q.id}`);
                    translationText.style.display = translationText.style.display === 'block' ? 'none' : 'block';
                    event.target.textContent = translationText.style.display === 'block' ? '[Ẩn dịch nghĩa]' : '[Hiển thị dịch nghĩa]';
                });

                // Gán observer cho mỗi câu hỏi
                observer.observe(questionCard);
            });
            submitButton.classList.remove('hidden'); // Hiển thị nút nộp bài
            renderSidebar(); // Tải sidebar
            // Đặt câu hỏi đầu tiên là câu hỏi hiện tại và cuộn tới nó nếu có
            if (questions.length > 0) {
                currentQuestionId = questions[0].id;
                updateSidebarHighlight();
            }
        }

        function submitQuiz() {
            let correctAnswers = 0;
            questions.forEach(q => {
                const questionCard = document.getElementById(`question-${q.id}`);
                const explanationDiv = document.getElementById(`explanation-${q.id}`);
                const sidebarItem = document.getElementById(`sidebar-item-${q.id}`);

                questionCard.classList.add('answered'); // Đánh dấu câu hỏi đã được trả lời
                explanationDiv.classList.remove('hidden');

                // Tự động hiển thị dịch nghĩa sau khi nộp bài
                const translationText = document.getElementById(`dich-text-${q.id}`);
                translationText.style.display = 'block';
                const dichToggle = questionCard.querySelector(`.dich-toggle[data-question-id="${q.id}"]`);
                if (dichToggle) {
                    dichToggle.textContent = '[Dịch nghĩa đã hiển thị]'; // Cập nhật text
                    dichToggle.style.pointerEvents = 'none'; // Vô hiệu hóa nút toggle
                    dichToggle.style.color = '#9ca3af'; // Màu xám cho biết không còn tương tác
                    dichToggle.style.textDecoration = 'none';
                }

                const selectedOptionIndex = userAnswers[q.id];
                let isQuestionCorrect = false;

                q.options.forEach((option, index) => {
                    const optionElement = questionCard.querySelector(`input[value="${index}"]`).closest('.answer-option');
                    const radioInput = optionElement.querySelector('input');
                    radioInput.disabled = true; // Vô hiệu hóa các lựa chọn sau khi nộp bài

                    if (option.isCorrect) {
                        optionElement.classList.add('correct');
                        if (selectedOptionIndex !== index) { // Nếu chưa chọn đáp án đúng, hiển thị biểu tượng đúng
                            optionElement.innerHTML += `<span class="correct-indicator">✔</span>`;
                        }
                    }

                    if (selectedOptionIndex === index) { // Nếu người dùng đã chọn đáp án này
                        if (!option.isCorrect) { // Và nó sai
                            optionElement.classList.add('incorrect');
                            optionElement.innerHTML += `<span class="incorrect-indicator">✖</span>`;
                        } else { // Hoặc đúng
                            optionElement.innerHTML += `<span class="correct-indicator">✔</span>`;
                            isQuestionCorrect = true; // Đánh dấu câu hỏi này đúng
                        }
                    }
                });

                if (selectedOptionIndex !== undefined && isQuestionCorrect) {
                    correctAnswers++;
                }

                // Cập nhật trạng thái đúng/sai lên sidebar
                if (sidebarItem) {
                    sidebarItem.classList.remove('answered'); // Remove generic answered class
                    if (isQuestionCorrect) {
                        sidebarItem.classList.add('correct-answer');
                    } else {
                        sidebarItem.classList.add('incorrect-answer');
                    }
                }


                // Hiển thị giải thích
                const correctAnswerText = q.options.find(opt => opt.isCorrect).text;
                // Lấy phần text chính và phần dịch nghĩa từ đáp án đúng
                const [correctAnswerValue, correctAnswerTranslation] = correctAnswerText.split(' - ').map(s => s.trim());

                explanationDiv.innerHTML = `<strong>Đáp án đúng:</strong> ${correctAnswerValue}. <br> <strong>Giải thích:</strong> ${correctAnswerTranslation || 'Không có giải thích cụ thể.'}`;
            });

            correctCountSpan.textContent = correctAnswers;
            totalQuestionsSpan.textContent = questions.length;
            scoreContainer.classList.remove('hidden');
            submitButton.classList.add('hidden'); // Ẩn nút nộp bài sau khi đã nộp
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Cuộn lên đầu trang để xem kết quả
            observer.disconnect(); // Ngừng quan sát khi đã nộp bài
        }

        function restartQuiz() {
            loadQuiz();
            submitButton.classList.remove('hidden');
            scoreContainer.classList.add('hidden');
            // Bắt đầu lại quan sát các câu hỏi
            questions.forEach(q => {
                const questionCard = document.getElementById(`question-${q.id}`);
                if (questionCard) observer.observe(questionCard);
            });
        }

        // Sự kiện khi tải trang
        window.onload = function() {
            loadQuiz();
            submitButton.addEventListener('click', submitQuiz);
            reviewAnswersButton.addEventListener('click', () => {
                // Cuộn về đầu trang nếu muốn
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
            restartQuizButton.addEventListener('click', restartQuiz);
        };
