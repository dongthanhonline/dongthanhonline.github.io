<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CQRS Ultimate Analyzer</title>
    <style>
        :root { --primary: #27ae60; --secondary: #2980b9; --dark: #1e1e1e; --bg: #f4f7f6; --text: #d4d4d4; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
        header { background: #2c3e50; color: white; padding: 10px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .main-layout { display: grid; grid-template-columns: 400px 1fr; gap: 20px; padding: 20px; flex: 1; overflow: hidden; }
        
        /* LEFT COLUMN - CONTROLS */
        .sidebar { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px; }
        .sidebar h3 { margin-top: 0; color: #333; border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: 'Consolas', monospace; }
        textarea { flex: 1; min-height: 300px; font-size: 12px; }
        button { cursor: pointer; border: none; border-radius: 6px; padding: 12px; font-weight: bold; color: white; transition: 0.3s; }
        .btn-load { background: var(--primary); }
        .btn-trace { background: var(--secondary); }
        .btn-detail { background: #8e44ad; }
        button:hover { opacity: 0.8; }

        /* RIGHT COLUMN - RESULTS */
        .content-area { display: flex; flex-direction: column; background: var(--dark); border-radius: 12px; overflow: hidden; }
        .tabs { display: flex; background: #333; padding: 5px 5px 0 5px; }
        .tab-btn { background: transparent; color: #888; border: none; padding: 10px 20px; cursor: pointer; border-radius: 8px 8px 0 0; }
        .tab-btn.active { background: var(--dark); color: var(--primary); font-weight: bold; }
        
        .tab-content { display: none; padding: 20px; flex: 1; overflow-y: auto; color: var(--text); font-family: 'Consolas', monospace; }
        .tab-content.active { display: block; }

        /* TAB DETAIL STYLING */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background: #333; color: var(--primary); font-size: 12px; }
        .node-file { color: #66d9ef; font-weight: bold; }
        .tag { display: inline-block; background: rgba(39, 174, 96, 0.2); color: #2ecc71; padding: 2px 8px; border-radius: 4px; margin: 2px; font-size: 11px; }
        .warning { color: #e74c3c; font-size: 11px; }
		
		.action-line { 
			display: block; 
			padding-left: 40px; 
			font-size: 12px; 
			line-height: 1.5;
			margin: 2px 0;
		}
		.act-db { color: #ce9178; }
		.act-rec { color: #4ec9b0; }
		.act-vet { color: #c586c0; }
		.act-int { color: #dcdcaa; }
    </style>
</head>
<body>

<header>
    <strong>CQRS Tracer Pro v2.0</strong> | Backend Lead Code Review Tool
</header>

<div class="main-layout">
    <div class="sidebar">
        <h3>Control Panel</h3>
        <button class="btn-load" onclick="loadProject()">📁 1. Load Project Folder</button>
        
        <div>
            <label style="font-size: 12px; font-weight: bold;">2. API Root Name:</label>
            <input type="text" id="rootFileName" placeholder="e.g., CreateOrderCommand">
        </div>
        
        <button class="btn-trace" onclick="traceDependency()">🚀 3. Trace Tree</button>
        
        <label style="font-size: 12px; font-weight: bold;">4. Dependency Structure:</label>
        <textarea id="treeResult" placeholder="Dependency tree will appear here..."></textarea>
        
        <button class="btn-detail" onclick="analyzeDetail()">🔍 5. Deep Analysis (Impact)</button>
    </div>

    <div class="content-area">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'tabTree')">🌳 Analysis Tree</button>
            <button class="tab-btn" onclick="switchTab(event, 'tabDB')">🗄️ DB Impact</button>
            <button class="tab-btn" onclick="switchTab(event, 'tabRecurly')">💳 Recurly</button>
            <button class="tab-btn" onclick="switchTab(event, 'tabVetspire')">🏥 Vetspire</button>
            <button class="tab-btn" onclick="switchTab(event, 'tabInternal')">⚙️ Internal Logic</button>
        </div>

        <div id="tabTree" class="tab-content active">No tree data available.</div>
        <div id="tabDB" class="tab-content"></div>
        <div id="tabRecurly" class="tab-content"></div>
        <div id="tabVetspire" class="tab-content"></div>
        <div id="tabInternal" class="tab-content"></div>
    </div>
</div>

<script>
    let projectFiles = new Map();
    let globalResources = { db: new Map(), recurly: new Map(), vetspire: new Map(), internal: new Map() };

    // 1. LOAD PROJECT
    async function loadProject() {
        try {
            const dirHandle = await window.showDirectoryPicker();
            projectFiles.clear();
            await scanFiles(dirHandle);
            alert(`Success! Loaded ${projectFiles.size} .cs files`);
        } catch (e) { console.error(e); }
    }

    async function scanFiles(dirHandle) {
        for await (const entry of dirHandle.values()) {
            if (entry.kind === 'directory') {
                if (!['bin', 'obj', '.git', 'Migrations'].includes(entry.name)) await scanFiles(entry);
            } else if (entry.name.endsWith('.cs')) {
                const file = await entry.getFile();
                let content = await file.text();
                let formatted = content.replace(/[\u00a0\ufeff]/g, " ")
                                       .split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0).join(" ");
                formatted = formatted.replace(/\s*\.\s*/g, ".");
                projectFiles.set(entry.name.replace('.cs', ''), formatted);
            }
        }
    }

    // 2. TRACE DEPENDENCY TREE
    function traceDependency() {
        const rootName = document.getElementById('rootFileName').value.trim().replace('.cs', '');
        if (!projectFiles.has(rootName)) { alert("Root file not found!"); return; }

        let treeStr = "";
        let visited = new Set();

        function build(name, level) {
            const indent = "\t".repeat(level);
            treeStr += indent + name + "\n";
            if (visited.has(name)) return;
            visited.add(name);

            const content = projectFiles.get(name);
            const regex = /([\w]+)\.(Command|Query)\s*\(/g;
            let match;
            while ((match = regex.exec(content)) !== null) {
                if (projectFiles.has(match[1]) && match[1] !== name) build(match[1], level + 1);
            }
        }
        build(rootName, 0);
        document.getElementById('treeResult').value = treeStr;
        document.getElementById('tabTree').innerHTML = `<pre>${treeStr}</pre>`;
    }

    // 3. DEEP ANALYSIS
    function analyzeDetail() {
		const treeInput = document.getElementById('treeResult').value;
		if (!treeInput) return;

		globalResources = { db: new Map(), recurly: new Map(), vetspire: new Map(), internal: new Map() };
		const lines = treeInput.split('\n').filter(l => l.trim() !== "");
		
		let richTreeHtml = "";

		lines.forEach(line => {
			const match = line.match(/^(\t*)(.*)$/);
			const indentStr = match[1];
			const fileName = match[2].trim();
			
			const content = projectFiles.get(fileName);

			richTreeHtml += `<div style="margin-top: 8px; white-space: pre;">${indentStr}<span class="node-file">${fileName}</span>`;

			if (content) {
				const actions = extractActions(fileName, content);
				const actionIndent = indentStr + "\t"; 

				if (actions.db.size > 0) {
					richTreeHtml += `<div class="action-line act-db" style="white-space: pre;">${actionIndent}DB: ${Array.from(actions.db).join(", ")}</div>`;
				}
				if (actions.recurly.size > 0) {
					richTreeHtml += `<div class="action-line act-rec" style="white-space: pre;">${actionIndent}Recurly: ${Array.from(actions.recurly).join(", ")}</div>`;
				}
				if (actions.vetspire.size > 0) {
					richTreeHtml += `<div class="action-line act-vet" style="white-space: pre;">${actionIndent}Vetspire: ${Array.from(actions.vetspire).join(", ")}</div>`;
				}
				if (actions.internal.size > 0) {
					richTreeHtml += `<div class="action-line act-int" style="white-space: pre;">${actionIndent}Internal: ${Array.from(actions.internal).join(", ")}</div>`;
				}
			} else {
				richTreeHtml += ` <span class="warning">[NOT FOUND]</span>`;
			}
			richTreeHtml += `</div>`;
		});

		document.getElementById('tabTree').innerHTML = richTreeHtml;
		renderImpactTables();
	}

	function extractActions(fileName, content) {
		let res = { db: new Set(), recurly: new Set(), vetspire: new Set(), internal: new Set() };
		
		const dbRegex = /_(?:[\w]*Context|context|db|dbContext)\.([\w]+)/g;
		const recRegex = /_recurlyClient\.([\w]+)/g;
		const vetRegex = /_vetspireService\.([\w]+)/g;
		const intRegex = /_matchingLogic\.([\w]+)/g;

		const sys = ["Where", "Any", "First", "Select", "Count", "Include", "Add", "Update", "Remove", "Save", "Set", "Entry", "ToList"];

		let m;
		while ((m = dbRegex.exec(content))) {
			if(!sys.some(s => m[1].includes(s))) {
				addRes('db', m[1], fileName);
				res.db.add(m[1]);
			}
		}
		while ((m = recRegex.exec(content))) {
			addRes('recurly', m[1], fileName);
			res.recurly.add(m[1]);
		}
		while ((m = vetRegex.exec(content))) {
			addRes('vetspire', m[1], fileName);
			res.vetspire.add(m[1]);
		}
		while ((m = intRegex.exec(content))) {
			addRes('internal', m[1], fileName);
			res.internal.add(m[1]);
		}

		function addRes(type, method, file) {
			if (!globalResources[type].has(method)) globalResources[type].set(method, new Set());
			globalResources[type].get(method).add(file);
		}
		return res;
	}

    function renderImpactTables() {
        const render = (map, id, label) => {
            let html = `<h3>${label} Inventory</h3><table><thead><tr><th>#</th><th>Resource Name</th><th>Callers (Files)</th></tr></thead><tbody>`;
            let i = 1;
            if (map.size === 0) { document.getElementById(id).innerHTML = "No impact found."; return; }
            
            map.forEach((files, resource) => {
                const tags = Array.from(files).map(f => `<span class="tag">${f}</span>`).join("");
                html += `<tr><td>${i++}</td><td style="color:#e6db74">${resource}</td><td>${tags}</td></tr>`;
            });
            document.getElementById(id).innerHTML = html + "</tbody></table>";
        };

        render(globalResources.db, 'tabDB', 'Database Table');
        render(globalResources.recurly, 'tabRecurly', 'Recurly API');
        render(globalResources.vetspire, 'tabVetspire', 'Vetspire Service');
        render(globalResources.internal, 'tabInternal', 'Internal Function');
    }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }
</script>
</body>
</html>
