<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Email Thread Parser</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .content-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .content-scroll::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .content-scroll::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 3px;
        }
        .content-scroll::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }
    </style>
</head>
<body class="font-sans text-slate-800 bg-slate-50 min-h-full p-4 md:p-8">

    <div class="max-w-[1400px] mx-auto space-y-6">

        <!-- 1. Header -->
        <header>
            <h1 class="text-2xl md:text-3xl font-bold text-slate-900 tracking-tight">Dynamic Email Thread Parser</h1>
        </header>

        <!-- 2. Raw Input & Parse Button -->
        <section class="space-y-3">
            <label for="raw-input" class="block font-semibold text-slate-800 text-base">
                Paste raw email content here:
            </label>
            <textarea id="raw-input" rows="6" class="w-full p-3 font-mono text-xs border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white shadow-xs resize-y leading-relaxed text-slate-700" placeholder="Paste raw email thread here..."></textarea>
            
            <div>
                <button id="btn-parse" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm rounded-lg shadow-xs transition duration-150 flex items-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>Parse & Convert Dynamic JSON</span>
                </button>
            </div>
        </section>

        <!-- 3. Summary Card -->
        <section id="summary-card" class="bg-blue-50/60 border border-blue-200 rounded-xl p-5 space-y-3 text-slate-800">
            <h2 class="text-xl font-bold text-blue-900" id="summary-subject">Subject: (No data yet)</h2>
            <div>
                <h3 class="font-bold text-slate-900 text-sm mb-1">Participating Senders:</h3>
                <ul class="list-disc list-inside text-sm space-y-1 font-medium text-slate-700 pl-1" id="participants-list">
                    <li>No analysis data yet.</li>
                </ul>
            </div>
        </section>

        <!-- 4. Table Header & Actions -->
        <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <h2 class="text-lg md:text-xl font-bold text-slate-900" id="table-title">
                    Email Thread Details (0 objects):
                </h2>
                <div class="flex items-center gap-2">
                    <button id="btn-translate-all" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium text-xs sm:text-sm rounded-lg shadow-xs transition flex items-center gap-1.5">
                        <i class="fa-solid fa-language"></i> Translate All
                    </button>
                    <!-- Import JSON Button -->
                    <button id="btn-import-json" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white font-medium text-xs sm:text-sm rounded-lg shadow-xs transition flex items-center gap-1.5">
                        <i class="fa-solid fa-upload"></i> Import JSON
                    </button>
                    <input type="file" id="import-file-input" accept=".json" class="hidden">
                    
                    <button id="btn-export-json" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-xs sm:text-sm rounded-lg shadow-xs transition flex items-center gap-1.5">
                        <i class="fa-solid fa-code"></i> Export JSON
                    </button>
                </div>
            </div>

            <!-- 5. Email Thread Table -->
            <div class="bg-white rounded-xl border border-slate-200 shadow-xs overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[950px]">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-xs font-bold text-slate-700 uppercase tracking-wider">
                            <th scope="col" class="py-3 px-4 w-12 text-center">#</th>
                            <th scope="col" class="py-3 px-4 w-80">Time - From | To - CC</th>
                            <th scope="col" class="py-3 px-8">Content</th>
                        </tr>
                    </thead>
                    <tbody id="email-tbody" class="divide-y divide-slate-200 text-xs sm:text-sm">
                        <!-- Dynamically rendered by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <!-- JSON Export Modal -->
    <div id="json-modal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl max-w-3xl w-full max-h-[80vh] flex flex-col shadow-xl overflow-hidden">
            <div class="p-4 bg-slate-100 border-b flex justify-between items-center">
                <h3 class="font-bold text-slate-800">Dynamic Converted JSON Output</h3>
                <button id="close-modal" class="text-slate-500 hover:text-slate-800 font-bold px-2 py-1">✕</button>
            </div>
            <div class="p-4 flex-1 overflow-auto bg-slate-900 text-emerald-400 font-mono text-xs">
                <pre id="json-output-content"></pre>
            </div>
        </div>
    </div>

    <script>
        const defaultRawText = ``;

        let parsedEmailsData = [];

        function parseRawEmailThread(rawText) {
            if (!rawText || !rawText.trim()) {
                return {
                    subject: "(No data)",
                    senders: [],
                    emails: []
                };
            }

            const rawBlocks = rawText.split(/(?:\r?\n)+(?=From:\s|On\s[A-Za-z]+,\s[A-Za-z]+\s\d+,\s\d+|On\s[A-Za-z]+,\s\d+\s[A-Za-z]+\s\d+)/g);
            
            let results = [];
            let sendersSet = new Set();
            let detectedSubject = "General Discussion";
            let seenSignatures = new Set();

            rawBlocks.forEach((block, index) => {
                let lines = block.trim().split('\n');
                let from = "";
                let to = "";
                let cc = "";
                let date = "Unknown Date";
                let subject = detectedSubject;
                let label = "Normal";
                let contentLines = [];
                let isHeaderSection = true;

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if (isHeaderSection) {
                        if (line.toLowerCase().startsWith("from:")) {
                            from = line.substring(5).trim();
                            sendersSet.add(from);
                            continue;
                        }
                        if (line.toLowerCase().startsWith("to:")) {
                            to = line.substring(3).trim();
                            continue;
                        }
                        if (line.toLowerCase().startsWith("cc:")) {
                            cc = line.substring(3).trim();
                            continue;
                        }
                        if (line.toLowerCase().startsWith("sent:") || line.toLowerCase().startsWith("date:")) {
                            date = line.substring(line.indexOf(':') + 1).trim();
                            continue;
                        }
                        if (line.toLowerCase().startsWith("subject:")) {
                            subject = line.substring(8).trim();
                            detectedSubject = subject;
                            if (subject.toLowerCase().includes("fwd:") || subject.toLowerCase().includes("forward")) {
                                label = "Forward";
                            }
                            continue;
                        }
                        if (line.toLowerCase().startsWith("on ") && line.toLowerCase().includes(" wrote:")) {
                            let matchText = line.substring(3, line.indexOf("wrote:")).trim();
                            let commaIdx = matchText.indexOf(',');
                            if (commaIdx !== -1) {
                                let secondCommaIdx = matchText.indexOf(',', commaIdx + 1);
                                if (secondCommaIdx !== -1) {
                                    date = matchText.substring(0, secondCommaIdx).trim();
                                    from = matchText.substring(secondCommaIdx + 1).trim();
                                } else {
                                    date = matchText.substring(0, commaIdx).trim();
                                    from = matchText.substring(commaIdx + 1).trim();
                                }
                            } else {
                                date = matchText;
                            }
                            if (from) sendersSet.add(from);
                            continue;
                        }
                        if (line === "" && contentLines.length > 0) {
                            isHeaderSection = false;
                            continue;
                        }
                        if (line.toLowerCase().startsWith("howdy") || line.toLowerCase().startsWith("hi ") || line.toLowerCase().startsWith("happy ") || i > 4) {
                            isHeaderSection = false;
                        }
                    }
                    
                    if (!isHeaderSection) {
                        contentLines.push(lines[i]);
                    } else {
                        if (index === 0 && i < 3 && !from.includes("@")) {
                            from = line;
                            sendersSet.add(from);
                        } else {
                            contentLines.push(lines[i]);
                        }
                    }
                }

                let cleanedContent = contentLines.join('\n').trim();
                if(!cleanedContent) cleanedContent = block.trim();

                if (cleanedContent.toLowerCase().includes("---------- forwarded message ---------") || 
                    cleanedContent.toLowerCase().includes("begin forwarded message")) {
                    label = "Forward";
                }

                let displayFrom = from || `User ${String.fromCharCode(65 + index)}`;
                sendersSet.add(displayFrom);

                let signature = `${displayFrom}_${date}`;
                if (!seenSignatures.has(signature)) {
                    seenSignatures.add(signature);
                    
                    results.push({
                        id: results.length + 1,
                        from: displayFrom,
                        to: to,
                        cc: cc,
                        date: date,
                        subject: subject,
                        label: label,
                        contentEn: cleanedContent,
                        contentVi: "",
                        isTranslated: false,
                        isLoading: false
                    });
                }
            });

            return {
                subject: detectedSubject,
                senders: Array.from(sendersSet),
                emails: results
            };
        }

        function renderDynamicUI(parsedData) {
            document.getElementById('summary-subject').innerText = `Subject: ${parsedData.subject}`;
            
            const pList = document.getElementById('participants-list');
            if (parsedData.senders.length > 0) {
                pList.innerHTML = parsedData.senders.map((s, idx) => `<li><strong>Sender ${idx + 1}:</strong> ${s}</li>`).join('');
            } else {
                pList.innerHTML = `<li>No specific senders detected.</li>`;
            }

            document.getElementById('table-title').innerText = `Email Thread Details (${parsedData.emails.length} JSON objects):`;

            const tbody = document.getElementById('email-tbody');
            if (parsedData.emails.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="py-8 text-center text-slate-400">Please paste raw email content above and click "Parse & Convert Dynamic JSON".</td></tr>`;
                return;
            }

            tbody.innerHTML = parsedData.emails.map((item) => {
                let badgeClass = "bg-blue-100 text-blue-800";
                if (item.label === "Forward") {
                    badgeClass = "bg-amber-100 text-amber-800";
                }

                let displayContent = item.isTranslated ? item.contentVi : item.contentEn;
                if (item.isLoading) {
                    displayContent = "Translating automatically via API...";
                }

                const btnLabel = item.isTranslated ? 'Original (EN)' : 'Translate (VI)';
                const btnClass = item.isTranslated ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : 'bg-slate-500 hover:bg-slate-600 text-white';

                let recipientHtml = "";
                if (item.to || item.cc) {
                    recipientHtml = `
                        ${item.to ? `<div><strong class="text-slate-900">To:</strong> ${item.to}</div>` : ''}
                        ${item.cc ? `<div class="text-slate-500 mt-1"><strong class="text-slate-700">Cc:</strong> ${item.cc}</div>` : ''}
                    `;
                } else {
                    recipientHtml = `
                        <div class="text-slate-500 italic bg-slate-100 p-2 rounded text-[11px] my-1">
                            <i class="fa-solid fa-share text-slate-400 mr-1"></i> Forwarded / Cited from another email
                        </div>
                    `;
                }

                return `
                    <tr class="hover:bg-slate-50/80 transition duration-150 border-b border-slate-200 align-top">
                        <td class="py-4 px-4 text-center font-bold text-slate-500">${item.id}</td>
                        
                        <!-- Column 1: Time - From | To - CC & Translate Button -->
                        <td class="py-4 px-4 space-y-2 text-xs">
                            <div class="font-medium text-slate-700 flex items-center gap-1.5">
                                <i class="fa-regular fa-clock text-slate-400"></i> <span>${item.date}</span>
                            </div>
                            <div class="font-bold text-slate-900 flex items-center gap-1.5">
                                <i class="fa-regular fa-user text-slate-500"></i> <span>${item.from}</span>
                            </div>
                            <hr class="border-slate-200 my-2">
                            ${recipientHtml}
                            <div class="pt-2">
                                <button onclick="toggleRowTranslation(${item.id})" class="px-2.5 py-1 text-[11px] font-semibold rounded shadow-2xs transition ${btnClass} flex items-center gap-1">
                                    <i class="fa-solid fa-language"></i> ${btnLabel}
                                </button>
                            </div>
                        </td>
                        
                        <!-- Column 2: Content & Label -->
                        <td class="py-4 px-6 text-slate-800 space-y-2">
                            <div class="max-h-60 overflow-y-auto pr-2 content-scroll whitespace-pre-line text-xs sm:text-sm leading-relaxed bg-slate-50/50 p-3 rounded-lg border border-slate-100">
                                ${displayContent}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // Translate text function using chunks to prevent length limits
        async function translateText(text) {
            let chunks = [];
            let maxChunkSize = 450;
            for (let i = 0; i < text.length; i += maxChunkSize) {
                chunks.push(text.substring(i, i + maxChunkSize));
            }

            let translatedChunks = [];
            for (let chunk of chunks) {
                let encodedText = encodeURIComponent(chunk);
                let url = `https://api.mymemory.translated.net/get?q=${encodedText}&langpair=en|vi`;
                let response = await fetch(url);
                let data = await response.json();
                
                if (data && data.responseData && data.responseData.translatedText) {
                    translatedChunks.push(data.responseData.translatedText);
                } else {
                    translatedChunks.push(chunk);
                }
            }
            return translatedChunks.join(' ');
        }

        async function toggleRowTranslation(id) {
            const email = parsedEmailsData.find(e => e.id === id);
            if (!email) return;

            if (email.contentVi) {
                email.isTranslated = !email.isTranslated;
                refreshUI();
                return;
            }

            email.isLoading = true;
            refreshUI();

            try {
                email.contentVi = await translateText(email.contentEn);
            } catch (error) {
                console.error("Translation failed:", error);
                email.contentVi = "[Network Error during translation]";
            }

            email.isLoading = false;
            email.isTranslated = true;
            refreshUI();
        }

        // Translate All feature
        document.getElementById('btn-translate-all').addEventListener('click', async () => {
            if (parsedEmailsData.length === 0) {
                alert("Please parse an email thread first!");
                return;
            }

            parsedEmailsData.forEach(email => {
                if (!email.contentVi) {
                    email.isLoading = true;
                }
            });
            refreshUI();

            for (let email of parsedEmailsData) {
                if (!email.contentVi) {
                    try {
                        email.contentVi = await translateText(email.contentEn);
                    } catch (error) {
                        email.contentVi = "[Translation Error]";
                    }
                    email.isLoading = false;
                }
                email.isTranslated = true;
            }
            refreshUI();
        });

        function refreshUI() {
            const currentResult = {
                subject: document.getElementById('summary-subject').innerText.replace('Subject: ', ''),
                senders: parsedEmailsData.map(e => e.from),
                emails: parsedEmailsData
            };
            renderDynamicUI(currentResult);
        }

        document.getElementById('btn-parse').addEventListener('click', () => {
            const rawText = document.getElementById('raw-input').value;
            const result = parseRawEmailThread(rawText);
            parsedEmailsData = result.emails;
            renderDynamicUI(result);
        });

        document.getElementById('btn-export-json').addEventListener('click', () => {
            if (parsedEmailsData.length === 0) {
                alert("Please click 'Parse' before exporting JSON!");
                return;
            }
            document.getElementById('json-output-content').innerText = JSON.stringify(parsedEmailsData, null, 4);
            document.getElementById('json-modal').classList.remove('hidden');
            document.getElementById('json-modal').classList.add('flex');
        });

        document.getElementById('close-modal').addEventListener('click', () => {
            document.getElementById('json-modal').classList.add('hidden');
            document.getElementById('json-modal').classList.remove('flex');
        });

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('raw-input').value = defaultRawText;
            const initialResult = parseRawEmailThread(defaultRawText);
            parsedEmailsData = initialResult.emails;
            renderDynamicUI(initialResult);
        });
        
        document.getElementById('btn-import-json').addEventListener('click', () => {
            document.getElementById('import-file-input').click();
        });
        
        document.getElementById('import-file-input').addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    
                    if (Array.isArray(importedData)) {
                        parsedEmailsData = importedData;
                        
                        let sendersSet = new Set();
                        parsedEmailsData.forEach(item => {
                            if (item.from) sendersSet.add(item.from);
                        });

                        const currentResult = {
                            subject: parsedEmailsData.length > 0 ? parsedEmailsData[0].subject : "Imported Discussion",
                            senders: Array.from(sendersSet),
                            emails: parsedEmailsData
                        };

                        renderDynamicUI(currentResult);
                        alert("Import JSON successfully!");
                    } else {
                        alert("Invalid JSON format! Expected an array of email objects.");
                    }
                } catch (error) {
                    console.error("Error parsing JSON:", error);
                    alert("Failed to parse JSON file. Please check the file format.");
                }
                event.target.value = '';
            };
            reader.readAsText(file);
        });
    </script>
</body>
</html>
